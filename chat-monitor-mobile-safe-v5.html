<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat Monitor — v5</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#17191d;--muted:#707781;--line:#dde1e6;--soft:#f2f4f6;--green:#2ca06b;--amber:#d79b26;--red:#d95050;--ink:#1d2025}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
button,input,select{font:inherit}.app{max-width:920px;margin:0 auto;padding:18px 16px 36px}header{padding:2px 0 14px}.topline{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:30px;line-height:1.05;margin:0;letter-spacing:-.035em}.stat{font-size:14px;color:#8a9099}.grow{flex:1}.search{width:100%;margin-top:16px;border:1px solid var(--line);background:#fff;border-radius:16px;padding:13px 16px;font-size:16px;outline:none}
.search:focus,.project-select:focus{border-color:#9ca3ad;box-shadow:0 0 0 3px rgba(50,60,75,.06)}.toolbar{display:flex;align-items:center;gap:10px;margin-top:11px}
.project-select{appearance:auto;max-width:260px;border:1px solid var(--line);background:#fff;color:#454b54;border-radius:999px;padding:9px 34px 9px 13px;font-size:14px;font-weight:700}.project-count{font-size:12px;color:#8e949c}
.section{margin:19px 0 22px}.section-title{display:flex;align-items:center;gap:8px;margin:0 3px 8px;color:#626975;font-size:15px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}.section-title small{font-size:12px;color:#9ba1aa;letter-spacing:0}
.rows{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:var(--panel)}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);min-height:58px}.row:first-child{border-top:0}
.titleline{display:flex;align-items:center;gap:7px;min-width:0}.pin-btn,.edit-btn,.dots{border:0;background:transparent;padding:4px;border-radius:8px;line-height:1;cursor:pointer}.pin-btn{font-size:17px;filter:grayscale(1);opacity:.28;transition:.12s ease}.pin-btn.is-pinned{filter:none;opacity:1}
.pin-btn:active,.edit-btn:active,.dots:active{transform:scale(.94);background:var(--soft)}.chat-title{min-width:0;color:inherit;text-decoration:none;font-size:17px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-touch-callout:default}.chat-title:hover{text-decoration:underline}
.edit-btn{font-size:12px;color:#9399a2}.dots{font-size:17px;color:#8e959f;font-weight:800;letter-spacing:1px}.load{display:inline-flex;gap:3px;align-items:center}.bar{width:8px;height:19px;border-radius:3px;background:#e3e6ea}.bar.g{background:var(--green)}.bar.a{background:var(--amber)}.bar.r{background:var(--red)}
.pinned-groups{display:flex;flex-direction:column;gap:10px}.pin-group{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff}.pin-group-head{padding:9px 14px 7px;background:#fafbfc;border-bottom:1px solid #eef0f3;color:#747b85;font-size:12px;font-weight:850;text-transform:uppercase;letter-spacing:.06em}
.empty{background:#fff;border:1px dashed #cfd4da;border-radius:16px;padding:18px;color:#848b95;text-align:center;font-size:14px}.hidden{display:none!important}.inline-edit{width:100%;min-width:0;border:1px solid #aebed2;border-radius:8px;padding:5px 7px;font-size:16px;font-weight:750}
@media(max-width:600px){.app{padding:16px 10px 30px}h1{font-size:25px}.stat{font-size:13px}.search{margin-top:14px;border-radius:14px;padding:12px 13px;font-size:15px}.toolbar{align-items:center}.project-select{max-width:100%;flex:1;font-size:14px;padding:8px 30px 8px 12px}.section{margin:17px 0 20px}.section-title{font-size:13px;margin-left:4px}.section-title small{font-size:11px}.row{grid-template-columns:minmax(0,1fr) 60px 28px;padding:11px 11px;gap:7px;min-height:56px}.chat-title{font-size:15.5px}.pin-btn{font-size:16px;padding:3px}.edit-btn{font-size:11px;padding:2px}.bar{width:8px;height:18px}.dots{font-size:16px;padding:3px}.pin-group-head{padding:8px 11px 6px;font-size:11px}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="topline"><h1>Chat Monitor</h1><span class="stat" id="activeStat">16 активных</span><div class="grow"></div></div>
<input id="search" class="search" type="search" placeholder="Поиск по активным чатам…" autocomplete="off">
<div class="toolbar"><select id="projectFilter" class="project-select" aria-label="Выбор проекта"><option value="all">Все проекты</option></select><span class="project-count" id="visibleCount"></span></div>
</header>
<section class="section" id="pinnedSection"><h2 class="section-title">📌 Закреплённые <small id="pinnedCount"></small></h2><div id="pinnedGroups" class="pinned-groups"></div></section>
<main id="projects"></main>
</div>
<script>
(function(){
'use strict';
const initialData=[
{project:'📥 Inbox',chats:[
{id:'inbox-new',title:'Новый активный чат — разобрать',href:'https://chatgpt.com/g/g-p-6aa64cea1c408191a7671ec2960d8df5/c/6ab3df12-97d4-83ed-b943-feae225e6c78',pinned:false,load:['g']},
{id:'couples',title:'Couples Language — упражнения RU↔NO',href:'https://chatgpt.com/g/g-p-6aa64cea1c408191a7671ec2960d8df5-couples-language/c/6a985c0b-f274-83eb-9c8e-dd5e60ef3ef8',pinned:false,load:['g','g']}]},
{project:'Организация работы',chats:[
{id:'audit-finish',title:'Аудит репозитория и Finish',href:'https://chatgpt.com/g/g-p-6a9a77c9cf08819182efa5abddb5607d/c/6ab8cecd-1838-83ed-a71e-b7b2f167f8f9',pinned:true,load:['r','r','r','r']},
{id:'monitor',title:'Монитор активных чатов',href:'https://chatgpt.com/g/g-p-6a9a77c9cf08819182efa5abddb5607d-organizatsiia-raboty/c/6ab8853a-31ac-83ed-b428-6b2b56121b4e',pinned:true,load:['g','g']}]},
{project:'Учебники маме',chats:[
{id:'video-images',title:'Создание иллюстраций для видео',href:'https://chatgpt.com/g/g-p-6a8e5fe8af008191a57934d72f2aa408-uchebniki-mame/c/6ab87a25-bac4-83ed-9ffb-8e3f83c3ee65',pinned:true,load:['g','g']},
{id:'exercise-dev',title:'Проверка разработки упражнений',href:'https://chatgpt.com/g/g-p-6a8e5fe8af008191a57934d72f2aa408-uchebniki-mame/c/6a9805b8-b068-83ed-9af6-029779ac7157',pinned:true,load:['r','r','r','r']},
{id:'page-preview',title:'Разработка страницы / preview',href:'https://chatgpt.com/g/g-p-6a8e5fe8af008191a57934d72f2aa408-uchebniki-mame/c/6a972f8b-ca10-83eb-8e49-2a3f76f84ce1',pinned:true,load:['a','a','a']},
{id:'starlight11',title:'Упражнения Starlight 11',href:'https://chatgpt.com/g/g-p-6a8e5fe8af008191a57934d72f2aa408/c/6a900289-4e9c-83ed-b8bb-f2dd05d5a1cd',pinned:false,load:['g','g']}]},
{project:'Уделываем Яндекс',chats:[
{id:'norms',title:'Перепроверить нормы взыскания',href:'https://chatgpt.com/g/g-p-6a625cae357081918f672c62c7302bae-udelyvaem-iandeks/c/6a798e5a-1020-83eb-849c-994a8c7c76ec',pinned:true,load:['a','a','a']},
{id:'letter2',title:'Корректировка письма 2',href:'https://chatgpt.com/g/g-p-6a625cae357081918f672c62c7302bae-udelyvaem-iandeks/c/6aadddce-3f5c-83eb-b6e3-ce80d9ce8c24',pinned:true,load:['r','r','r','r']},
{id:'archive-letter1',title:'Архивация документа «Письмо 1»',href:'https://chatgpt.com/g/g-p-6a625cae357081918f672c62c7302bae-udelyvaem-iandeks/c/6aadfb2d-8794-83ed-ba00-cb554cb4e9d5',pinned:false,load:['g','g']}]},
{project:'Составление текстов',chats:[
{id:'fssp',title:'ФССП — основания жалобы',href:'https://chatgpt.com/g/g-p-6a820f42e6a8819193b0c525eea6d5fa-sostavlenie-tekstov/c/6ab5513f-8808-83eb-a552-38179ce0cacc',pinned:true,load:['a','a','a']},
{id:'rkn',title:'Роскомнадзор — редактура жалобы',href:'https://chatgpt.com/g/g-p-6a820f42e6a8819193b0c525eea6d5fa-sostavlenie-tekstov/c/6ab5858b-b62c-83ed-9f58-31b5a1c5f495',pinned:false,load:['g','g']},
{id:'letter31',title:'Письмо 3.1 — финальная редакция',href:'https://chatgpt.com/g/g-p-6a820f42e6a8819193b0c525eea6d5fa-sostavlenie-tekstov/c/6ab56433-c894-83eb-a517-0e2177b94656',pinned:false,load:['a','a','a']},
{id:'letter4',title:'Письмо 4 — правки',href:'https://chatgpt.com/g/g-p-6a820f42e6a8819193b0c525eea6d5fa-sostavlenie-tekstov/c/6ab3db6a-1e5c-83eb-a36a-38b68844ac2c',pinned:false,load:['g']}]},
{project:'Реализация идеи',chats:[
{id:'idea-plan',title:'План разработки проекта',href:'https://chatgpt.com/g/g-p-6a5beef172fc8191b6abc55be6808782-realizatsiia-idei/c/6a8a3c96-e9e8-83eb-a457-57d7f11a6aba',pinned:true,load:['a','a','a']}]}];
const STORAGE='chat-monitor-v5-pins',data=JSON.parse(JSON.stringify(initialData));
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&typeof saved==='object')data.forEach(p=>p.chats.forEach(c=>{if(Object.prototype.hasOwnProperty.call(saved,c.id))c.pinned=!!saved[c.id]}))}catch(e){}
const search=document.getElementById('search'),filter=document.getElementById('projectFilter'),projectsEl=document.getElementById('projects'),pinnedGroups=document.getElementById('pinnedGroups'),pinnedSection=document.getElementById('pinnedSection'),pinnedCount=document.getElementById('pinnedCount'),visibleCount=document.getElementById('visibleCount'),activeStat=document.getElementById('activeStat');
data.forEach(p=>{const opt=document.createElement('option');opt.value=p.project;opt.textContent=p.project.replace(/^📥\s*/,'');filter.appendChild(opt)});
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function loadHtml(load){const colors=load||[];return '<span class="load" title="Нагрузка '+colors.length+'/4">'+[0,1,2,3].map((_,i)=>'<i class="bar '+(colors[i]||'')+'"></i>').join('')+'</span>'}
function rowHtml(chat,compact){return '<div class="row" data-id="'+esc(chat.id)+'"><div class="titleline"><button class="pin-btn '+(chat.pinned?'is-pinned':'')+'" type="button" aria-label="'+(chat.pinned?'Открепить':'Закрепить')+'" title="'+(chat.pinned?'Открепить':'Закрепить')+'">📌</button><a class="chat-title" href="'+esc(chat.href)+'">'+esc(chat.title)+'</a>'+(compact?'':'<button class="edit-btn" type="button" title="Переименовать в Monitor">✎</button>')+'</div>'+loadHtml(chat.load)+(compact?'':'<button class="dots" type="button" aria-label="Ещё">•••</button>')+'</div>'}
function currentFilter(){return filter.value||'all'}function currentQuery(){return search.value.trim().toLowerCase()}
function matches(chat,project){const f=currentFilter(),q=currentQuery();if(f!=='all'&&project!==f)return false;if(q&&!(chat.title+' '+project).toLowerCase().includes(q))return false;return true}
function savePins(){const obj={};data.forEach(p=>p.chats.forEach(c=>obj[c.id]=c.pinned));try{localStorage.setItem(STORAGE,JSON.stringify(obj))}catch(e){}}
function findChat(id){for(const p of data){for(const c of p.chats){if(c.id===id)return c}}return null}
function render(){let visible=0,total=0,pinVisible=0;data.forEach(p=>p.chats.forEach(()=>total++));activeStat.textContent=total+' активных';projectsEl.innerHTML='';
data.forEach(p=>{const chats=p.chats.filter(c=>matches(c,p.project));if(!chats.length)return;visible+=chats.length;const section=document.createElement('section');section.className='section project-section';section.dataset.project=p.project;section.innerHTML='<h2 class="section-title">'+esc(p.project)+' <small>'+chats.length+'</small></h2><div class="rows">'+chats.map(c=>rowHtml(c,false)).join('')+'</div>';projectsEl.appendChild(section)});
pinnedGroups.innerHTML='';data.forEach(p=>{const chats=p.chats.filter(c=>c.pinned&&matches(c,p.project));if(!chats.length)return;pinVisible+=chats.length;const group=document.createElement('div');group.className='pin-group';group.innerHTML='<div class="pin-group-head">'+esc(p.project)+'</div><div class="rows" style="border:0;border-radius:0">'+chats.map(c=>rowHtml(c,true)).join('')+'</div>';pinnedGroups.appendChild(group)});
pinnedCount.textContent=String(pinVisible);pinnedSection.classList.toggle('hidden',pinVisible===0);visibleCount.textContent=visible===total?'':visible+' из '+total;if(!projectsEl.children.length)projectsEl.innerHTML='<div class="empty">Ничего не найдено</div>'}
filter.addEventListener('change',render);search.addEventListener('input',render);
document.addEventListener('click',function(e){const pin=e.target.closest('.pin-btn');if(pin){const row=pin.closest('.row'),c=row&&findChat(row.dataset.id);if(!c)return;c.pinned=!c.pinned;savePins();render();return}
const edit=e.target.closest('.edit-btn');if(edit){const row=edit.closest('.row'),c=row&&findChat(row.dataset.id);if(!c)return;const a=row.querySelector('.chat-title');if(!a)return;const input=document.createElement('input');input.className='inline-edit';input.value=c.title;a.replaceWith(input);input.focus();input.select();let doneOnce=false;const done=save=>{if(doneOnce)return;doneOnce=true;if(save&&input.value.trim())c.title=input.value.trim();render()};input.addEventListener('keydown',ev=>{if(ev.key==='Enter')done(true);if(ev.key==='Escape')done(false)});input.addEventListener('blur',()=>done(true),{once:true})}});
render();
})();
</script>
</body>
</html>
